<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
</head>
<body style="background-color: #212121; color: aliceblue;">
    <h2>Amazing Images</h2>
    <div>
        <ul id="images">
            <li><img width="200px" id="photoshop" src="https://images.pexels.com/photos/3561339/pexels-photo-3561339.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt="photoshop"></li>
            <li><img width="200px" id="japan" src="https://images.pexels.com/photos/3532553/pexels-photo-3532553.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt=""></li>
            <li><img width="200px" id="river" src="https://images.pexels.com/photos/3532551/pexels-photo-3532551.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt=""></li>
            <li><img width="200px" id="owl" src="https://images.pexels.com/photos/3532552/pexels-photo-3532552.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt="" ></li>
            <li><img width="200px" id="prayer" src="https://images.pexels.com/photos/2522671/pexels-photo-2522671.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt=""></li>
            <li><a style="color: aliceblue;" href="https://google.com" id="google">Google</a></li>
        </ul>
   </div>
</body>
<script>
    // type, timestamp, defaultPrevented
    // target, toElement, srcElement, currentTarget,
    // clientX, clientY, screenX, screenY
    // altkey, ctrlkey, shiftkey, keyCode

    // document.getElementById('images').addEventListener('click',(e) => {
    //     console.log('You clicked on ul')
    // },true)

    // document.getElementById('owl').addEventListener('click',(e) => {
    //     console.log('You clicked on owl')
    // },false)
    // // here, "true" and "false" are the useCapture parameter of addEventListener
    // // true -> capturing phase, false (which is the default) = bubbling phase
    // // the above code would print "You clicked on ul" and finally "You clicked on owl"
    // // code above, would print "You clicked on owl" then finally "You clicked on ul" if useCapture was false for both or false for images and true for owl

    // // event propagation -> how an event travels through DOM tree when something happens, for example a click.

    // // .stopPropagation() stops from event from travelling through rest of DOM tree


    document.getElementById('google').addEventListener('click',(e)=> {
        e.preventDefault()
        console.log(e.defaultPrevented); // returns true or false if default action was prevented
    })

    // const images = document.querySelectorAll('#images')
    // images.forEach( (items) => {
    //     items.addEventListener('click', (e) => {
    //         e.target.outerHTML = ""
    //     })
    // } ) (Methohd 1)

    const images = document.querySelector('#images')
    images.addEventListener('click', (e) => {
        // e.target.parentNode.outerHTML = "" // we could do this
        if (e.target.tagName === "IMG" || e.target.tagName === "A") {
            let removeIt = e.target.parentNode
            removeIt.remove()
        // removeIt.parentNode.removeChild(removeIt) another way
        // what is happening in the removeChild code above is, removeIt's parent node = ul, if we remove it's child (removeIt), it will remove li of whichever target is triggering the event
        }
    })

</script>
</html>
